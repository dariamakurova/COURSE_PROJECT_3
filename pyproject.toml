[project]
name = "course-project-3"
version = "0.1.0"
description = ""
authors = [
    {name = "Daria_Makurova",email = "dariamakurova@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.linters.dependencies]
flake8 = "^7.3.0"
mypy = "^1.19.1"
isort = "^7.0.0"
black = "^26.1.0"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[tool.black]
# Максимальная длина строки
line-length = 119
exclude = '.git'

[tool.isort]
# максимальная длина строки
line_length = 119